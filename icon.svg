<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2A3E"/>
      <stop offset="1" stop-color="#061019"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.55">
      <stop offset="0" stop-color="#28C7D6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#28C7D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.08" y1="0.05" x2="0.92" y2="0.95">
      <stop offset="0" stop-color="#FFD874"/>
      <stop offset="0.5" stop-color="#F5A302"/>
      <stop offset="1" stop-color="#DE7509"/>
    </linearGradient>
    <linearGradient id="hex" x1="0.12" y1="0.08" x2="0.9" y2="0.94">
      <stop offset="0" stop-color="#42ECD6"/>
      <stop offset="1" stop-color="#128FB4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- gauge track -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#123A50" stroke-width="34"/>
  <!-- gauge progress (~75%, rounded cap), starts at top -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="34"
          stroke-linecap="round" stroke-dasharray="706.9 235.6" transform="rotate(-90 256 256)"/>

  <!-- ore crystal hexagon -->
  <polygon points="256,176 325,217 325,295 256,336 187,295 187,217" fill="url(#hex)"
           stroke="#BFF6EE" stroke-opacity="0.35" stroke-width="2"/>
  <!-- facet highlight (left faces) -->
  <polygon points="256,176 256,336 187,295 187,217" fill="#FFFFFF" fill-opacity="0.13"/>
  <!-- inner facet line -->
  <line x1="256" y1="176" x2="256" y2="336" stroke="#0B3A44" stroke-opacity="0.25" stroke-width="2"/>
</svg>
